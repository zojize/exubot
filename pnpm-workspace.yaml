minimumReleaseAgeExclude:
  - '@nuxt/devtools-assets@4.2.2'
  - '@nuxt/devtools-kit@4.2.2'
  - '@nuxt/devtools@4.2.2'
  - '@puppeteer/browsers@3.3.0'
  - nuxt-discord@0.1.0
  - puppeteer-core@25.19.0
  - puppeteer@25.19.0

peerDependencyRules:
  ignoreMissing:
    - webpack

shellEmulator: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  puppeteer: true
  unrs-resolver: true
  vue-demi: true

catalogs:
  build:
    '@nuxt/devtools': ^4.2.2
    '@nuxt/eslint': ^1.17.0
    '@nuxtjs/color-mode': ^4.1.0
    '@pinia/nuxt': ^1.0.3
    '@unocss/eslint-config': ^66.13.0
    '@unocss/nuxt': ^66.13.0
    '@unocss/preset-web-fonts': ^66.13.0
    '@vite-pwa/nuxt': ^2.0.4
    '@vueuse/nuxt': ^15.1.0
    nuxt: ^4.7.0
    unocss: ^66.13.0
  dev:
    '@antfu/eslint-config': ^10.0.0
    '@types/node': ^24
    eslint: ^10.15.0
    eslint-plugin-format: ^2.0.1
    typescript: npm:@typescript/typescript6@^6.0.2
    vue-tsc: ^3.3.14
  frontend:
    '@vueuse/core': ^15.1.0
    pinia: ^4.1.0
    vue: ^3.5.46
  icons:
    '@iconify-json/carbon': ^1.2.30
    '@iconify-json/twemoji': ^1.2.5
  server:
    chokidar: ^6.0.0
    discord.js: ^14.28.1
    nuxt-discord: 0.1.0
    puppeteer: ^25.19.0
